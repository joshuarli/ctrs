# Declared PILOT workloads for the native-performance campaign; NOT frozen.
# IDs match docs/campaign-native-performance.md. `status`:
#   implemented = fixture + runner path exist and have produced trials
#   pending     = declared, not yet implemented
#   blocked     = cannot run on this host (record reason in evidence doc)
# Implementation status does not establish representative-workload,
# asset, environment, or statistical qualification. See the progress queue.

schema_version = 1

[meta]
campaign = "native-performance"
created = "2026-11-14"
competitors = ["orbstack"]          # macOS lane; Docker Desktop excluded
active_lane = "macos-arm64"
evidence_status = "pilot"
measurement_revision = "2026-11-15-reorientation"
strict_win_pct = 5.0
noninferiority_pct = 3.0
bootstrap_iters = 2000
bootstrap_confidence = 0.95

[[case]]
id = "W1"
family = "web-stack-bring-up"
title = "compose up: API + Postgres + Redis -> verified health + DB/cache roundtrip + persistence across db restart"
fixture = "fixtures/w1"
status = "implemented"
metrics = ["wall_seconds", "time_to_health_s", "time_to_roundtrip_s",
           "peak_total_rss_kb", "cpu_seconds_est"]
states = ["warm"]                    # cold implemented for ctrs only (engine-cold); orbstack cold unsupported on shared daemon
correctness = ["health", "roundtrip_db_and_cache", "persist_after_db_restart"]

[[case]]
id = "W2"
family = "api-service-under-load"
title = "sustained mixed read/write JSON load vs seeded Postgres+Redis stack via published port"
fixture = "fixtures/w1 + fixtures/w2/load.py"
status = "implemented"
metrics = ["wall_seconds", "rps", "p50_ms", "p95_ms", "p99_ms", "errors",
           "peak_total_rss_kb", "cpu_seconds_est"]
states = ["warm"]
params = { concurrency = [1, 4, 8, 16], duration_s = 20, write_ratio = 0.3, seed_rows = 500 }
correctness = ["http_errors_zero", "item_count_equals_seed_plus_writes"]

[[case]]
id = "W3"
family = "persistent-transactional"
title = "postgres:17-alpine: migrations + 300-tx deterministic mix + CHECKPOINT + docker restart + exact row verification on named volume"
fixture = "inline (postgres:17-alpine service image)"
status = "implemented"
metrics = ["up_s", "migrate_s", "txmix_s", "tx_tps", "checkpoint_s", "restart_s"]
states = ["warm"]
params = {}
correctness = ["db_ready", "migrate", "txmix", "checkpoint", "restart_ready", "verify_rows (count+sum+k+meta exact)"]
note = "SQL generated by the runner; each tx = INSERT+UPDATE+COMMIT on a shared meta row (realistic row contention). Volume and container are per-trial unique and removed after."

[[case]]
id = "W4"
family = "worker-queue"
title = "200 deterministic jobs on a Redis list drained by 1/4/16 concurrent worker containers; per-worker-count drain wall + md5 result verification"
fixture = "inline (redis:7-alpine queue + workers on a private bridge network)"
status = "implemented"
metrics = ["workers_1_s", "workers_4_s", "workers_16_s", "jobs"]
states = ["warm"]
params = { jobs = 200 }
correctness = ["workers_<W> all rc=0", "results == jobs", "md5 sample matches"]
note = "v1: jobs are fixed strings; workers RPOP/SET md5 via redis-cli in redis:7-alpine. Queue is a dedicated ephemeral container+network per trial (also exercises network create/teardown). API-ingest path deferred."

[[case]]
id = "W5"
family = "monorepo-edit-test-loop"
title = "60-module python repo: timed docker run test loop on host bind mount vs named volume, host edit between bind iterations"
fixture = "fixtures/w5/repo"
status = "implemented"
metrics = ["bind_median_s", "volume_median_s", "bind_iters_s", "volume_iters_s"]
states = ["warm"]
params = { iters = 5 }
correctness = ["volume_seed", "bind_iter_<i> marker+edit visible", "vol_iter_<i> marker"]
note = "v1 uses a python fixture repo (offline); a TS/pnpm repo is deferred. Bind iterations verify host->guest write coherence via the printed edit marker. Host bind = virtiofs path; named volume = guest-native storage — kept as separate metrics, never blended."

[[case]]
id = "W6"
family = "compiled-app-ci"
title = "timed docker build of vendored zlib 1.3.1 (configure -> make -j -> make check) on gcc:14.2.0-bookworm + libz.a sha256 probe"
fixture = "fixtures/w6 (zlib-1.3.1.tar.gz + Dockerfile)"
status = "implemented"
metrics = ["build_s", "artifact_sha256"]
states = ["warm"]
params = { driver = ["default", "dc"] }
correctness = ["build rc=0", "artifact sha256 present"]
note = "PILOT: zlib 1.3.1 is the 'other language' half only — the pinned Rust app is still missing. Source archive is gitignored and fetched on demand via ensure_w6_source() with a pinned sha256 (official madler/zlib v1.3.1 GitHub release asset). Explicit --no-cache and a per-pair stamp ensure distinct compilation attempts with identical A/B input; retained base images mean this is not engine-cold. The artifact sha256 probe records the produced libz.a hash but does not yet assert an expected value. Default and controlled dc builder results remain separate. Old run_id-only cache-stamp measurements require a new baseline."

[[case]]
id = "W7"
family = "native-image-build"
title = "pilot multi-stage Dockerfile: uncached/warm/incremental work + run probe (stores remain warm)"
fixture = "fixtures/w7"
status = "implemented"
metrics = ["build_uncached_s", "build_warm_s", "build_incr_s"]
states = ["warm"]
params = { driver = ["default", "dc"] }
correctness = ["build_uncached", "build_warm", "build_incr", "run_note", "run_smoke"]
note = "PILOT proxy: compileall/random bytes still needs replacement by two real app builds. --no-cache bypasses reuse for the first build without pruning the shared builder; engine/base-image stores remain warm. Warm repeats the context; incremental changes stamp/note.txt. --load includes image-store import. Historical build_empty_s is not comparable to build_uncached_s."

[[case]]
id = "W8"
family = "real-image-deployment"
title = "pull pinned portfolio of relocated real-rootfs images from local OCI registry by digest; run each image's smoke command; optional W2 load during pulls"
fixture = "fixtures/w8 + per-engine registry:2"
status = "implemented"
metrics = ["wall_seconds", "pull_wall_seconds", "setup_seconds",
           "pull_<name>_s", "run_<name>_s",
           "load_rps", "load_p95_ms", "load_p99_ms",
           "peak_total_rss_kb", "cpu_seconds_est"]
states = ["warm"]                    # cold unsupported: registry+portfolio live on the warm engine
params = { under_load = [false, true], duration_s = 30, concurrency = 8, write_ratio = 0.3 }
correctness = ["pull_<name>_digest_match", "run_<name>",
               "load item_count + zero errors (under_load only)"]
note = "PILOT: per-engine scratch+COPY portfolios are not yet identical pinned multi-layer assets. Only fixture refs are removed; content remains warm on both engines, so dedup may eliminate fetch/install. No shared image prune or ctrs restart. Requires independent local registry, common digests and real deploy-to-health before qualification."

[[case]]
id = "W9"
family = "parallel-ci-churn"
title = "J concurrent docker run jobs (1/4/8/16) doing ~0.6 s CPU work each in python:3.13-slim; wall time + marker verification"
fixture = "inline (python:3.13-slim service image)"
status = "implemented"
metrics = ["jobs_1_s", "jobs_4_s", "jobs_8_s", "jobs_16_s"]
states = ["warm"]
params = {}
correctness = ["jobs_<J> all markers present, rc=0"]
note = "v1 churn: concurrent create/start/run/rm with CPU work and log capture; temp networks, writable-layer writes and artifact collection are deferred to a v2 cell."

[[case]]
id = "W10"
family = "failure-recovery"
title = "kill API container mid-load, restart after 3 s, verify recovery + no lost committed writes"
fixture = "fixtures/w1 + fixtures/w2/load.py"
status = "implemented"
metrics = ["recovery_s", "load_errors", "load_rps", "load_p95_ms", "load_p99_ms", "items_got"]
states = ["warm"]
params = { duration_s = 20, concurrency = 8, write_ratio = 0.3, kill_at_s = 6, down_for_s = 3 }
correctness = ["api_found", "kill_rc", "start_rc", "recovered",
               "no_lost_writes (items >= 500 + acked writes)"]
note = "PILOT: API-container interruption only; engine/VM recovery remains unqualified and shared OrbStack must not be restarted. load_rps now counts successful responses, unlike historical attempted throughput; the historical reporter excludes W10 throughput. Expected outage errors and recovered tails need explicit attribution. Lost committed writes or failed recovery always fail."

[[case]]
id = "W11"
family = "soak"
title = "pilot sustained load windows + container churn; correctness gates, resource-growth qualification pending"
fixture = "fixtures/w1 + fixtures/w2/load.py + inline churn"
status = "implemented"
metrics = ["soak_seconds", "windows", "requests", "requests_ok", "errors", "error_pct",
           "rps_mean", "churn_jobs_completed", "churn_failures",
           "engine_version_check_failures", "invalid_load_windows", "peak_total_rss_kb",
           "cpu_seconds_est"]
states = ["warm"]
params = { duration_s = 300, window_s = 30, concurrency = 8, write_ratio = 0.3, churn_jobs = 8, churn_every = 4 }
correctness = ["engine_alive", "errors_zero", "load_windows_valid",
               "churn_all_ok", "item_count == expected"]
note = "PILOT default 300 s in fixture (CLI defaults to 20 s, so pass --duration explicitly). Qualification is one finite 12-hour run per engine on a frozen candidate, after representative mixed workloads and growth gates are implemented. Requires zero errors, valid nonempty window summaries, exact acknowledged writes and successful churn. Alive probes do not yet establish continuous process identity. Resource growth is sampled but not gated; raw window/request/churn counts are not speed claims."

[[case]]
id = "HOLDOUT"
family = "holdout-real-app"
title = "real third-party app never tuned against: Gitea 1.24.7 + Postgres 17 — REST API seed + timed read workload + git smart-HTTP clones over the published port"
fixture = "fixtures/holdout"
status = "implemented"
metrics = ["setup_seconds", "time_to_health_s", "admin_s", "seed_s",
           "workload_s", "ops", "ops_per_s", "api_errors", "clone_s",
           "clones", "peak_total_rss_kb", "cpu_seconds_est"]
states = ["warm"]
params = { ops = 240, repos = 8, issues_per_repo = 5, clones = 4, seed = 1 }
correctness = ["healthz", "admin_created", "repos_exact", "issues_exact",
               "workload_zero_errors", "clones_exact"]
note = "EXCLUDED from the scored W-matrix. Declared pilot parameters require input/version qualification before final confirmation. Run once per engine for the frozen candidate; if a failure is used for tuning, retire it as independent evidence and choose a fresh holdout. Different stack from W fixtures (Go forge + git protocol + Postgres)."

[[case]]
id = "W10"
family = "failure-recovery"
title = "interrupt an owned service or private ctrs engine and verify exact recovered work"
fixture = "fixtures/w1 + recovery_client.py for API/database; fixtures/w4 for queue"
fixture_version = "w10-v4-recovery"
status = "implemented"
metrics = ["recovery_s", "recovered_p99_ms", "recovered_requests_ok", "retries_until_recovery",
           "expected_outage_errors", "unexpected_errors", "acknowledged_writes", "persisted_uncertain_writes"]
states = ["warm"]
params = { duration_s = 20, concurrency = 8, write_ratio = 0.3, kill_at_s = 6, down_for_s = 3, interrupt_service = ["api", "db", "queue", "engine"] }
correctness = ["exact seed and acknowledged writes", "only exact attempted writes may persist after an uncertain acknowledgement", "successful load before and after recovery", "zero unexplained errors", "owned cleanup"]
note = "API and database recovery uses the common pinned stack and ends on the first exact read. Queue recovery verifies the persisted FIFO backlog and uses a fresh verified batch for p99. The private ctrs engine diagnostic establishes durable startup authentication before load and verifies it after restart."


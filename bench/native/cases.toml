[[case]]
id = "W6"
family = "compiled-app-ci"
title = "timed docker builds: pinned hyperfine 2.0.0 (Rust cargo build+test --locked) and zlib 1.3.1 (C configure/make/check); artifact sha256 probes"
fixture = "fixtures/w6 (zlib-1.3.1.tar.gz + hyperfine-2.0.0.tar.gz, checksum-pinned fetch; rust/Dockerfile + Dockerfile)"
status = "implemented"
metrics = ["build_rust_s", "build_zlib_s", "artifact_rust_sha256", "artifact_zlib_sha256"]
states = ["warm"]
params = { driver = ["default", "dc"], build_cache = ["uncached", "warm"] }
correctness = ["BuildKit proves the compile and test step executed for uncached builds and was reused for warm builds", "artifact sha256 matches the ARM64 pins for each"]
note = "Pinned upstream hyperfine 2.0.0 and zlib 1.3.1 sources are fetched on demand. A shared per-pair stamp gives identical A/B inputs. Uncached bypasses layer reuse, while warm primes the exact context before measuring. Both conditions retain base images. Artifact SHA-256 pins are in assets.lock. Keep cache conditions, default driver, and identical-builder controls distinct."

[[case]]
id = "W7"
family = "native-image-build"
title = "default buildx -> loaded runnable images for two real apps: hyperfine 2.0.0 (Rust) and httpie 3.2.4 (Python); uncached/warm/incremental per app"
fixture = "fixtures/w7 (hyperfine/Dockerfile + httpie/Dockerfile; pinned source archives via ensure_pinned_source)"
status = "implemented"
fixture_version = "w7-v3-cache-first-use"
metrics = ["hyperfine_uncached_s", "hyperfine_warm_s", "hyperfine_incr_s",
           "httpie_uncached_s", "httpie_warm_s", "httpie_incr_s",
           "hyperfine_uncached_first_use_s", "hyperfine_warm_first_use_s", "hyperfine_incr_first_use_s",
           "httpie_uncached_first_use_s", "httpie_warm_first_use_s", "httpie_incr_first_use_s"]
states = ["warm"]
params = { driver = ["default", "dc"] }
correctness = ["all builds load an owned tag", "compile and note cache state proved in raw BuildKit progress", "exact version output and note in every cache state", "owned output tags cleaned up"]
note = "Real pinned upstream apps in multi-stage Dockerfiles: rust:1.100.0-bookworm cargo build --release --locked -> debian:bookworm-slim, python:3.13-slim PyPI sdist -> pip wheel -> offline wheel install -> python:3.13-slim. Sources are sha256-pinned archives (codeload / PyPI digest) fetched on demand. --no-cache bypasses reuse for the first build without pruning the shared builder; engine/base-image stores remain warm. Warm repeats the identical context; incremental bumps stamp/note.txt after the compile/package stage so only tail layers rerun. --load includes image-store import; run probes verify the loaded image executes. Old synthetic compileall/urandom metrics are not comparable."


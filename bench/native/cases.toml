# Declared PILOT workloads for the native-performance campaign; NOT frozen.
# IDs match docs/campaign-native-performance.md. `status`:
#   implemented = fixture + runner path exist and have produced trials
#   pending     = declared, not yet implemented
#   blocked     = cannot run on this host (record reason in evidence doc)
# Implementation status does not establish representative-workload,
# asset, environment, or statistical qualification. See the progress queue.

schema_version = 1

[meta]
campaign = "native-performance"
created = "2026-11-14"
competitors = ["orbstack"]          # macOS lane; Docker Desktop excluded
active_lane = "macos-arm64"
evidence_status = "pilot"
measurement_revision = "2026-11-17-native-v4-resource-admission"
strict_win_pct = 5.0
noninferiority_pct = 3.0
bootstrap_iters = 2000
bootstrap_confidence = 0.95

[[case]]
id = "W1"
family = "web-stack-bring-up"
title = "compose up: API + Postgres + Redis -> verified health + DB/cache roundtrip + persistence across db restart"
fixture = "fixtures/w1"
status = "implemented"
metrics = ["wall_seconds", "time_to_health_s", "time_to_roundtrip_s",
           "peak_total_rss_kb", "peak_phys_footprint_bytes", "cpu_seconds_est"]
states = ["warm"]                    # cold implemented for ctrs only (engine-cold); orbstack cold unsupported on shared daemon
correctness = ["health", "roundtrip_db_and_cache", "persist_after_db_restart"]

[[case]]
id = "W2"
family = "api-service-under-load"
title = "sustained mixed read/write JSON load vs seeded Postgres+Redis stack via published port"
fixture = "fixtures/w1 + fixtures/w2/load.py"
status = "implemented"
fixture_version = "w2-v2-fixed-work"
metrics = ["cpu_seconds_per_success", "wall_seconds", "rps", "p50_ms", "p95_ms", "p99_ms", "errors",
           "peak_total_rss_kb", "peak_phys_footprint_bytes", "cpu_seconds_est"]
states = ["warm"]
params = { modes = ["fixed-work", "saturation"], operations = 50000, concurrency = [1, 4, 8, 16], duration_s = 20, write_ratio = 0.3, seed_rows = 500 }
correctness = ["http_errors_zero", "item_count_equals_seed_plus_writes", "exact_persisted_names_and_payloads", "fixed_work_complete"]

[[case]]
id = "W3"
family = "persistent-transactional"
title = "postgres:17-alpine: migrations + 300-tx deterministic mix + CHECKPOINT + docker restart + exact row verification on named volume"
fixture = "inline (postgres:17-alpine service image)"
status = "implemented"
metrics = ["up_s", "migrate_s", "txmix_s", "tx_tps", "checkpoint_s", "restart_s", "pgdata_allocated_bytes"]
states = ["warm"]
params = {}
correctness = ["db_ready", "migrate", "txmix", "checkpoint", "restart_ready", "verify_rows (count+sum+k+meta exact)"]
note = "SQL generated by the runner; each tx = INSERT+UPDATE+COMMIT on a shared meta row (realistic row contention). Volume and container are per-trial unique and removed after."

[[case]]
id = "W4"
family = "worker-queue"
title = "HTTP ingest -> Redis -> 1/4/16 workers -> exact gzip NDJSON and aggregate summaries on named volumes"
fixture = "fixtures/w4"
fixture_version = "w4-v2-events"
status = "implemented"
metrics = ["workers_1_s", "workers_4_s", "workers_16_s", "jobs", "events", "artifacts"]
states = ["warm"]
params = { jobs = 200, events_per_job = 64, workers = [1, 4, 16] }
correctness = ["Redis-backed readiness", "all worker exits zero", "all 400 artifacts exact", "no pending jobs, duplicate, missing, corrupt or extra outputs", "owned cleanup"]
note = "v2 event-batch processing replaces v1 Redis shell hashing. Primary interval includes HTTP submission and worker drain to closed artifact files; setup, verification and cleanup are separate. Base Python and Redis content digests are pinned. Real engine pilots and a frozen fixture image are required before acceptance; v1 results are never pooled."

[[case]]
id = "W5"
family = "monorepo-edit-test-loop"
title = "Pinned Marked TypeScript CLI: persistent esbuild watch -> exact CLI HTML after source edits"
fixture = "fixtures/w5-v2"
fixture_version = "w5-v2-marked"
status = "implemented"
metrics = ["bind_edit_to_result_median_s", "volume_edit_to_result_median_s", "bind_setup_s", "volume_setup_s"]
states = ["warm"]
params = { iters = 5 }
correctness = ["source and dependency lock hashes", "pinned native ARM64 tool image", "persistent watcher PID/start identity", "exact rebuilt CLI output each edit", "owned cleanup"]
note = "v2 uses real TS sources and dependencies; host bind edits use the coordinator file write, guest volume edits include Docker exec transport. Startup/population separate. Old Python fixture remains diagnostic data and its timings are incompatible. Workload/image must still be frozen before qualification."

[[case]]
id = "W6"
family = "compiled-app-ci"
title = "timed docker builds: pinned hyperfine 2.0.0 (Rust cargo build+test --locked) and zlib 1.3.1 (C configure/make/check); artifact sha256 probes"
fixture = "fixtures/w6 (zlib-1.3.1.tar.gz + hyperfine-2.0.0.tar.gz, checksum-pinned fetch; rust/Dockerfile + Dockerfile)"
status = "implemented"
metrics = ["build_rust_s", "build_zlib_s", "artifact_rust_sha256", "artifact_zlib_sha256"]
states = ["warm"]
params = { driver = ["default", "dc"] }
correctness = ["both build rc=0 (includes cargo test / make check)", "artifact sha256 matches the ARM64 pins for each"]
note = "Real pinned upstream sources: hyperfine v2.0.0 codeload archive (sha256-pinned, Cargo.lock --locked) on rust:1.100.0-bookworm, zlib 1.3.1 GitHub release asset on gcc:14.2.0-bookworm. Archives are gitignored and fetched on demand via ensure_pinned_source(). Per-pair stamp + explicit --no-cache give distinct compilation with identical A/B input; retained base images mean this is not engine-cold. Artifact SHA-256 pins are in assets.lock. Default and controlled dc builder results remain separate; old run_id-only cache-stamp measurements are not comparable."

[[case]]
id = "W7"
family = "native-image-build"
title = "default buildx -> loaded runnable images for two real apps: hyperfine 2.0.0 (Rust) and httpie 3.2.4 (Python); uncached/warm/incremental per app"
fixture = "fixtures/w7 (hyperfine/Dockerfile + httpie/Dockerfile; pinned source archives via ensure_pinned_source)"
status = "implemented"
metrics = ["hyperfine_uncached_s", "hyperfine_warm_s", "hyperfine_incr_s", "httpie_uncached_s", "httpie_warm_s", "httpie_incr_s"]
states = ["warm"]
params = { driver = ["default", "dc"] }
correctness = ["all builds rc=0 per app", "version probe output per app", "note marker reads incremental-1"]
note = "Real pinned upstream apps in multi-stage Dockerfiles: rust:1.100.0-bookworm cargo build --release --locked -> debian:bookworm-slim, python:3.13-slim PyPI sdist -> pip wheel -> offline wheel install -> python:3.13-slim. Sources are sha256-pinned archives (codeload / PyPI digest) fetched on demand. --no-cache bypasses reuse for the first build without pruning the shared builder; engine/base-image stores remain warm. Warm repeats the identical context; incremental bumps stamp/note.txt after the compile/package stage so only tail layers rerun. --load includes image-store import; run probes verify the loaded image executes. Old synthetic compileall/urandom metrics are not comparable."

[[case]]
id = "W8"
family = "real-image-deployment"
title = "paired derived common portfolio pull and deployment"
fixture = "fixtures/w8-v3 + independent host registry"
status = "implemented"
metrics = ["pull_to_health_s", "under_pull_p95_ms", "under_pull_p99_ms", "cpu_seconds_est", "peak_phys_footprint_bytes"]
states = ["warm"]
params = { under_load = [false, true] }
correctness = ["full transfers", "image identities and markers", "exact application outputs", "owned cleanup"]
note = "Paired pilot only; warm preconditioning excluded; allocation, continuous peaks, client and sampler accounting and qualification remain open."

[[case]]
id = "W9"
family = "parallel-ci-jobs"
title = "16 fixed Marked TypeScript build/CLI-test jobs at concurrency 1/4/8/16"
fixture = "fixtures/w9-v2 + pinned common W8 Marked image"
fixture_version = "w9-v2-marked-fixed16"
status = "implemented"
metrics = ["fixed16_at_1_s", "fixed16_at_4_s", "fixed16_at_8_s", "fixed16_at_16_s"]
states = ["warm"]
params = {}
correctness = ["16 complete jobs per declared concurrency", "exact tools/source lock", "identical pinned bundle hash", "all CLI goldens exact", "owned cleanup"]
note = "jobs.json owns fixed work and concurrency. --image-ref must name the pinned preinstalled common Marked manifest. Warmup excludes VM boot; each job phase includes create/start/build/test/rm. Separate setup and cleanup counters. Old timed-loop records remain historical diagnostics and are not pooled."

[[case]]
id = "W10"
family = "failure-recovery"
title = "kill API container mid-load, restart after 3 s, verify recovery + no lost committed writes"
fixture = "fixtures/w1 + fixtures/w2/load.py"
status = "implemented"
metrics = ["recovery_s", "load_errors", "load_rps", "load_p95_ms", "load_p99_ms", "items_got"]
states = ["warm"]
params = { duration_s = 20, concurrency = 8, write_ratio = 0.3, kill_at_s = 6, down_for_s = 3 }
correctness = ["api_found", "kill_rc", "start_rc", "recovered",
               "no_lost_writes (items >= 500 + acked writes)"]
note = "PILOT: API-container interruption only; engine/VM recovery remains unqualified and shared OrbStack must not be restarted. load_rps now counts successful responses, unlike historical attempted throughput; the historical reporter excludes W10 throughput. Expected outage errors and recovered tails need explicit attribution. Lost committed writes or failed recovery always fail."

[[case]]
id = "W11"
family = "soak"
title = "pilot sustained load windows + container churn; correctness gates, resource-growth qualification pending"
fixture = "fixtures/w1 + fixtures/w2/load.py + inline churn"
status = "implemented"
metrics = ["soak_seconds", "windows", "requests", "requests_ok", "errors", "error_pct",
           "rps_mean", "churn_jobs_completed", "churn_failures",
           "engine_version_check_failures", "invalid_load_windows", "peak_total_rss_kb",
           "cpu_seconds_est"]
states = ["warm"]
params = { duration_s = 300, window_s = 30, concurrency = 8, write_ratio = 0.3, churn_jobs = 8, churn_every = 4 }
correctness = ["engine_alive", "errors_zero", "load_windows_valid",
               "churn_all_ok", "item_count == expected"]
note = "LEGACY DIAGNOSTIC only; these request-window/churn metrics cannot qualify W11. Representative v2 short cycles now live in diagnostics/mixed_pilot.py and fixtures/w11-v2: persistent API/DB/cache, fixed real queue artifacts and build/test jobs, exact cumulative state and process identity. Do not pool v1/v2 records. Durable finite 12-hour execution, frozen inputs and resource-growth qualification remain open."

[[case]]
id = "HOLDOUT"
family = "holdout-real-app"
title = "real third-party app never tuned against: Gitea 1.24.7 + Postgres 17 — REST API seed + timed read workload + git smart-HTTP clones over the published port"
fixture = "fixtures/holdout"
status = "implemented"
metrics = ["setup_seconds", "time_to_health_s", "admin_s", "seed_s",
           "workload_s", "ops", "ops_per_s", "api_errors", "clone_s",
           "clones", "peak_total_rss_kb", "peak_phys_footprint_bytes", "cpu_seconds_est"]
states = ["warm"]
params = { ops = 240, repos = 8, issues_per_repo = 5, clones = 4, seed = 1 }
correctness = ["healthz", "admin_created", "repos_exact", "issues_exact",
               "workload_zero_errors", "clones_exact"]
note = "EXCLUDED from the scored W-matrix. Declared pilot parameters require input/version qualification before final confirmation. Run once per engine for the frozen candidate; if a failure is used for tuning, retire it as independent evidence and choose a fresh holdout. Different stack from W fixtures (Go forge + git protocol + Postgres)."

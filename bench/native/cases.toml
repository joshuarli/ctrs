# Declared PILOT workloads for the native-performance campaign; NOT frozen.
# IDs match docs/campaign-native-performance.md. `status`:
#   implemented = fixture + runner path exist and have produced trials
#   pending     = declared, not yet implemented
#   blocked     = cannot run on this host (record reason in evidence doc)
# Implementation status does not establish representative-workload,
# asset, environment, or statistical qualification. See the progress queue.

schema_version = 1

[meta]
campaign = "native-performance"
created = "2026-11-14"
competitors = ["orbstack"]          # macOS lane; Docker Desktop excluded
active_lane = "macos-arm64"
evidence_status = "pilot"
measurement_revision = "2026-11-17-native-v4-resource-admission"
strict_win_pct = 5.0
noninferiority_pct = 3.0
bootstrap_iters = 2000
bootstrap_confidence = 0.95

[[case]]
id = "W1"
family = "web-stack-bring-up"
title = "compose up: API + Postgres + Redis -> verified health + DB/cache roundtrip + persistence across db restart"
fixture = "fixtures/w1"
fixture_version = "w1-v2-pinned-restart"
status = "implemented"
metrics = ["wall_seconds", "time_to_health_s", "time_to_roundtrip_s",
           "peak_total_rss_kb", "peak_phys_footprint_bytes", "cpu_seconds_est"]
states = ["warm"]                    # cold implemented for ctrs only (engine-cold); orbstack cold unsupported on shared daemon
correctness = ["pinned image IDs and ordered DiffIDs", "exact initial database row and cache roundtrip", "acknowledged write before restart", "same owned database container and named volume with a new start time", "exact DB/cache reads after restart", "acknowledged new write after restart", "owned cleanup"]

[[case]]
id = "W2"
family = "api-service-under-load"
title = "sustained mixed read/write JSON load against a seeded stack from the host or an owned peer"
fixture = "fixtures/w1 + fixtures/w2/load.py or fixtures/w2/v3.py"
status = "implemented"
fixture_version = "w2-v2-fixed-work"
metrics = ["cpu_seconds_per_success", "wall_seconds", "rps", "p50_ms", "p95_ms", "p99_ms", "errors",
           "peak_total_rss_kb", "peak_phys_footprint_bytes", "cpu_seconds_est"]
states = ["warm"]
params = { modes = ["fixed-work", "fixed-rate", "saturation"], client_location = ["host", "guest"], operations = 50000, concurrency = [1, 4, 8, 16], duration_s = 20, write_ratio = 0.3, seed_rows = 500 }
correctness = ["http_errors_zero", "item_count_equals_seed_plus_writes", "exact_persisted_names_and_payloads", "fixed_work_complete"]

[[case]]
id = "W3"
family = "persistent-transactional"
title = "postgres:17-alpine: migrations + 300-tx deterministic mix + CHECKPOINT + docker restart + exact row verification on named volume"
fixture = "inline (PostgreSQL pinned in the common W8 v2 portfolio)"
status = "implemented"
fixture_version = "w3-v3-pinned-commit-latency"
metrics = ["up_s", "migrate_s", "txmix_s", "tx_tps", "transaction_p95_ms", "checkpoint_s", "restart_s", "pgdata_allocated_bytes"]
states = ["warm"]
params = {}
correctness = ["db_ready", "migrate", "300 complete commit timing receipts", "checkpoint", "restart_ready", "exact key and payload rows, counter, and fsync setting"]
note = "A single psql connection sends one request per explicit INSERT+UPDATE transaction with synchronous_commit on. p95 uses the completed transaction timings. Volume and container are per-trial and removed after."

[[case]]
id = "W4"
family = "worker-queue"
title = "HTTP ingest -> Redis -> 1/4/16 workers -> exact gzip NDJSON and aggregate summaries on named volumes"
fixture = "fixtures/w4"
fixture_version = "w4-v4-boot-clock"
status = "implemented"
metrics = ["workers_1_s", "workers_4_s", "workers_16_s", "jobs", "events", "artifacts",
           "queue_p95_ms_at_1", "queue_p95_ms_at_4", "queue_p95_ms_at_16",
           "queue_p99_ms_at_1", "queue_p99_ms_at_4", "queue_p99_ms_at_16"]
states = ["warm"]
params = { jobs = 200, events_per_job = 64, workers = [1, 4, 16] }
correctness = ["Redis-backed readiness", "all worker exits zero", "all 400 artifacts exact", "200 matched queue timing receipts in the same guest boot clock", "no pending jobs, duplicate, missing, corrupt or extra outputs", "owned cleanup"]
note = "The primary interval includes HTTP submission and worker drain. The queue latency clock starts at enqueue preparation and stops after both artifacts close. Setup, verification and cleanup are separate. The W11 worker still uses the pinned v2 image."

[[case]]
id = "W5"
family = "monorepo-edit-test-loop"
title = "Pinned Marked TypeScript CLI: persistent esbuild watch -> exact CLI HTML after source edits"
fixture = "fixtures/w5-v2"
fixture_version = "w5-v3-marked-receipts"
status = "implemented"
metrics = ["bind_edit_to_result_median_s", "volume_edit_to_result_median_s", "bind_setup_s", "volume_setup_s"]

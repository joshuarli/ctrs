[package]
name = "kiri-image"
description = "OCI image references, registry pulls and the content-addressed blob store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
h12tiny-client-sync = { version = "0.9.0", default-features = false, features = ["tls"] }
http = { version = "1.5.0" }

[features]
default = []

[lints]
workspace = true

[package]
name = "kiri-image"
description = "OCI image references, registry pulls and the content-addressed blob store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
ureq = { version = "3", default-features = false, features = ["rustls"] }
h12tiny-client-sync = { version = "0.9.0", default-features = false, features = ["tls"], optional = true }
http = { version = "1.5.0", optional = true }

[features]
default = []
## CTRS-16 pilot: the registry client over h12tiny-client-sync (explicit
## Graviola + platform trust roots; no pool, no proxy). Experimental.
h12tiny = ["dep:h12tiny-client-sync", "dep:http"]

[lints]
workspace = true

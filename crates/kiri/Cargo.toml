[package]
name = "kiri"
description = "Tiny, fast container runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kiri-image = { path = "../kiri-image" }
kiri-proto = { path = "../kiri-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# gzip uploads to PUT /containers/{id}/archive (DDEV sends them).
flate2 = "1"
# `ureq::Proxy::new` validates the proxy setting; the pull client does its own TLS.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
kiri-vmm = { path = "../kiri-vmm" }


# The tests read back the tar archives the managed builder writes.
[dev-dependencies]
tar = "0.4"


[lints]
workspace = true

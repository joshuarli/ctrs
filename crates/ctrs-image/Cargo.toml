[package]
name = "ctrs-image"
description = "OCI image references, registry pulls and the content-addressed blob store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
# Published 0.9.0 plus the response-body shutdown handle used by pull cancellation.
h12tiny-client-sync = { git = "https://github.com/laputa-systems/smolith", rev = "448a24c7e799681d1a6a33b7668e47bbceb06587", default-features = false, features = ["tls"] }
http = { version = "1.5.0" }

[features]
default = []

[lints]
workspace = true

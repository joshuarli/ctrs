[package]
name = "ctrs-init"
description = "PID 1 and agent of the ctrs guest VM"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ctrs-proto = { path = "../ctrs-proto" }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
libc = "0.2"
ruzstd = "0.9"
tar = "0.4"
crabtables = { git = "https://github.com/laputa-systems/crabtables", rev = "38646b8f2f6ee7256c448849edda4459842a2e10", default-features = false, optional = true }

[features]
crabtables = ["dep:crabtables"]

[lints]
workspace = true

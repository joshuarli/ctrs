name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  benchmark-harness:
    name: Benchmark harness (offline)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate benchmark contracts and regression checks
        run: make test-bench

  macos:
    name: Test (macOS)
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$channel"
          rustup toolchain install --profile minimal "$channel"
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos-latest
      - name: Test
        run: make test

  arm64-compat:
    name: ARM64 qualification (AMD64 to ARM64)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The qualification RUN steps for arm64 execute under a binfmt handler;
      # ubuntu runners ship none by default. This does not (and cannot) prove
      # handler independence — the runner reports which backend served each
      # build; handler-free proof stays Needs environment.
      - name: Register QEMU binfmt handlers
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Install Rust toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$channel"
          rustup toolchain install --profile minimal "$channel"
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ubuntu-26.04-arm64-qual
      - name: Install pinned kache
        run: cargo install --locked --git https://github.com/joshuarli/kache --rev bcb257a6f8901a2bade7804121f562acae98de8b kache
      - name: Build the Linux engine (native AMD64)
        env:
          CARGO_ENCODED_RUSTFLAGS: ''
        run: cargo xtask linux --arch amd64
      - name: Run the ARM64 qualification runner
        env:
          CARGO_ENCODED_RUSTFLAGS: ''
        run: bash tests/arm64-build.sh --case environment --case compatibility --case platform --case cross --case identity --case lifecycle

  linux-musl:
    name: Test (Linux ${{ matrix.arch }} musl)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
            target: x86_64-unknown-linux-musl
            platform: linux/amd64
          - arch: ARM64
            runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Linux image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: ctrs-builder:${{ matrix.target }}
          cache-from: type=gha,scope=ctrs-${{ matrix.target }}
      - name: Test in image
        run: |
          docker run --rm --init \
            --platform "${{ matrix.platform }}" \
            -e CI \
            -v "$GITHUB_WORKSPACE:/ctrs" \
            -w /ctrs \
            ctrs-builder:${{ matrix.target }} \
            sh -ec 'cargo test --workspace --lib --tests --no-fail-fast'

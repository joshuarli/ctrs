[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
# Not a release number: a release takes its version from its tag (v0.2.0),
# set by the release build. Builds from a checkout say 0.0.0.
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
incremental = false
debug = "line-tables-only"
split-debuginfo = "unpacked"
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
# Backtraces in crash reports (`crate::diag`) keep their symbols.
strip = false

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
